# Support page FAQ. Answers are Markdown.
- group: Gameplay
  questions:
    - q: How do I play Nurikabe?
      a: >-
        Divide the grid into islands and sea. Each island must contain exactly one number and that
        many cells, including the numbered cell. Cells within an island connect along their edges.
        Separate islands cannot share an edge, but they can touch diagonally. All sea cells must
        connect along their edges, and no 2×2 square can be entirely sea. See the
        [four rules on the home page](/#how-to-play) for a quick reminder.
    - q: How do I mark a cell?
      a: >-
        Tap a cell once to fill it as sea. Tap again to mark it with a dot (confirmed island).
        Tap a third time to clear it back to empty.
    - q: What tools are available during a puzzle?
      a: >-
        In regular puzzles, use **Undo** to take back a move, **Redo** to reapply it, **Clear** to
        start the grid over, **Flood** to fill empty cells with sea, and **Hint** when you need help
        with your next move.
    - q: What does the hint button do?
      a: >-
        Tap **Hint** when you're stuck to reveal whether a cell should be island or sea. If you have
        a hint credit, the app uses it; otherwise, it offers the option to watch a rewarded ad.
    - q: How do I get more hints?
      a: >-
        If you have no hint credits left, tap **Hint** and follow the prompt to watch a rewarded ad.
        Ads require an internet connection and may not always be available.
    - q: Can I play offline?
      a: >-
        Yes. The core puzzles work offline, and your progress saves on your device. Connect to the
        internet to load fresh daily challenges, update leaderboards, make purchases, or watch
        rewarded ads.

- group: Progression
  questions:
    - q: How do I unlock more levels?
      a: >-
        Complete a level to unlock the next one in that board size. You can also use a rewarded ad
        to unlock the next level. For a different challenge, try the daily puzzles or browse
        additional puzzle packs in the shop.
    - q: Can I view completed levels?
      a: >-
        Tap a completed level to look over its solved grid. For a fresh puzzle, move on to the next
        level, try the daily challenges, or explore a puzzle pack in the shop.
    - q: What are the board sizes?
      a: >-
        There are three main sizes: **5×5** (quick warm-ups), **8×10** (medium challenges), and
        **10×15** (deep puzzles). The shop also offers **6×6** puzzle packs.

- group: Daily Challenge & Streaks
  questions:
    - q: How does the Daily Challenge work?
      a: >-
        Each day brings three puzzles: one each in 5×5, 8×10, and 10×15. Complete all three before
        the next daily reset to build your streak. Check the in-app countdown for the time remaining.
    - q: How do streaks work?
      a: >-
        Your streak counts consecutive days when you solve all three daily puzzles. Completing just
        one or two does not count as a finished day. Return each day and finish the set to keep
        your streak going.

- group: Settings & Customization
  questions:
    - q: How do I change the color theme?
      a: >-
        Open Settings from the main menu and tap any color swatch to apply a new theme. The change
        takes effect immediately across the entire app.
    - q: Is my progress saved?
      a: >-
        Your puzzle progress and settings save automatically on your device. Signing in to Game
        Center on iOS or Play Games on Android lets the app back up supported progress online. Use
        the same account when returning on another device on the same platform.

- group: Shop & Purchases
  questions:
    - q: What can I buy in the shop?
      a: >-
        Browse extra puzzle packs in 6×6, 8×10, and 10×15 sizes, or choose the option to remove
        ads. Check the app for current prices and purchase details.
    - q: How do I restore purchases?
      a: >-
        Make sure you're signed in to the Apple or Google account used for the purchase. Open
        **Settings** in the app and choose **Restore Purchases** while connected to the internet.
        If a purchase is still missing, contact support with the item name and your purchase
        receipt.

- group: Troubleshooting
  questions:
    - q: The app isn't working properly. What should I do?
      a: >-
        Close and reopen the app, then check the App Store or Google Play for an update. For issues
        with daily puzzles, ads, or purchases, check your internet connection too. If the problem
        continues, email [support@nurikabeislands.com](mailto:support@nurikabeislands.com) with
        your device model, app version, and the steps that led to the issue.
    - q: I lost my progress. Can it be restored?
      a: >-
        Connect to the internet and sign in to the same Game Center (iOS) or Play Games (Android)
        account you used before, then reopen the app so it can retrieve available saved progress.
        If progress is still missing, contact support before resetting or reinstalling. Progress
        stored only on your device may be lost when the app is uninstalled.
