title: Privacy Policy - Nurikabe Islands
description: Privacy Policy for Nurikabe Islands
heading: Privacy Policy
updated: "Last updated: April 4, 2026"
intro: >-
  The developer ("we", "our", or "us") operates the Nurikabe Islands mobile application (the
  "App"). This page informs you of our policies regarding the collection, use, and disclosure of
  personal information when you use our App.
sections:
  - heading: Information We Collect
    body: |
      Nurikabe Islands is designed with your privacy in mind. We collect minimal information:

      - **Game Progress:** Your puzzle progress and settings are stored on your device. When signed in to Game Center (iOS) or Play Games (Android), progress is also synced to their cloud so you can restore it on a new device. We do not have access to this data.
      - **Analytics:** We may collect anonymous usage statistics and ad delivery diagnostics to improve the app experience and ad reliability. This data cannot be used to identify you personally.
  - heading: Advertising
    body: |
      Our App uses Google AdMob to display advertisements. Google may collect and use data for personalized advertising. You can learn more about how Google uses data at [Google's Privacy Policy](https://policies.google.com/privacy){:target="_blank" rel="noopener"}.

      You can opt out of personalized advertising by adjusting your device settings or through the ad settings within the app.
  - heading: App Tracking Transparency
    body: >-
      On iOS 14.5 and later, we request your permission before tracking your activity across other
      companies' apps and websites for advertising purposes. You can change this permission at any
      time in your device's Settings.
  - heading: Data Storage
    body: >-
      Game data (progress, settings, preferences) is stored on your device. When you sign in to Game
      Center (iOS) or Play Games (Android), this data is also backed up to their cloud services so
      you can restore it on another device. We do not collect, store, or transmit your game data to
      our own servers.
  - heading: Children's Privacy
    body: >-
      Our App does not knowingly collect personal information from children under 13. The App is
      suitable for all ages and does not require any personal information to function.
  - heading: Third-Party Services
    body: >-
      Our App may contain links to third-party services. We are not responsible for the privacy
      practices of these external sites. We encourage you to review their privacy policies.
  - heading: Changes to This Policy
    body: >-
      We may update our Privacy Policy from time to time. We will notify you of any changes by
      posting the new Privacy Policy on this page and updating the "Last updated" date.
  - heading: Contact Us
    body: |
      If you have any questions about this Privacy Policy, please contact us at:

      [support@nurikabeislands.com](mailto:support@nurikabeislands.com)
